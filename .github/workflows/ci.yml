name: CI

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual runs

permissions:
  contents: read
  checks: write
  pull-requests: write

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Verify locked files integrity (SHA256)
        run: |
          echo "Computing SHA256 hashes for locked CV files..."
          sha256sum src/data/cv.json src/data/cv_de.json src/data/cv_fa.json
          echo ""
          echo "Note: Locked files must not be modified. Any changes will fail tests."
          echo "These hashes are validated in locked-files-integrity.test.ts"
        
      - name: Run linter
        run: npm run lint
        
      - name: Run TypeScript typecheck
        run: npm run typecheck
        
      # TODO: Enable format:check as blocking once codebase formatting is fixed
      # Currently 149 files have formatting issues. Run `npm run format` to fix.
      - name: Check code formatting (Prettier)
        run: npm run format:check
        continue-on-error: true
        
      - name: Run unit tests
        run: npm run test
        
      - name: Run language smoke validation
        run: npm run verify-languages
        
      - name: Build for production
        run: npm run build
        
      - name: Check build artifacts
        run: |
          echo "Checking build output..."
          test -f dist/index.html || (echo "Missing index.html" && exit 1)
          test -d dist/assets || (echo "Missing assets directory" && exit 1)
          echo "✅ Build artifacts verified"
          ls -lh dist/
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-artifacts
          path: frontend/dist/
          retention-days: 7
          
  visual-proof:
    name: Visual Proof (Screenshots)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        
      - name: Build application
        run: npm run build
        
      - name: Run Playwright screenshot tests
        run: npx playwright test
        continue-on-error: true # Don't fail if screenshots don't match, just upload them
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: frontend/test-results/
          retention-days: 7
          
  smoke-validation:
    name: Smoke Validation (EN/DE/FA)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate English data
        run: |
          echo "Validating English (EN) data..."
          npm run verify-languages | grep "English (EN):.*PASSED" || exit 1
          
      - name: Validate German data
        run: |
          echo "Validating German (DE) data..."
          npm run verify-languages | grep "German (DE):.*PASSED" || exit 1
          
      - name: Validate Persian data
        run: |
          echo "Validating Persian (FA) data..."
          npm run verify-languages | grep "Persian (FA):.*PASSED" || exit 1
          
      - name: All languages validated
        run: |
          echo "✅ All three languages (EN/DE/FA) validated successfully!"
          echo "No empty sections detected."
          echo "No undefined/null values detected."
