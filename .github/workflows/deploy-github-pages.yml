name: Deploy to GitHub Pages

# =========================================================================
# INTENTIONALLY DISABLED WORKFLOW
# =========================================================================
# This workflow is OPTIONAL and provides GitHub Pages deployment as a fallback.
# For better experience, use Vercel, Netlify, or Cloudflare Pages instead.
#
# STATUS: Disabled by design - not needed for current deployment strategy.
#
# WHY DISABLED:
# - The project uses alternative deployment methods (e.g., Vercel)
# - GitHub Pages requires additional repository settings configuration
# - This workflow is kept for reference and can be enabled if needed
#
# TO ENABLE THIS WORKFLOW:
# 1. Remove the global `if: false` condition below
# 2. Go to repository Settings → Pages
# 3. Under "Source", select "GitHub Actions"
# 4. Push to main branch or trigger manually
#
# BASE PATH HANDLING:
# - The build automatically sets the base path from GITHUB_REPOSITORY
# - This ensures assets resolve correctly for /repo-name/ deployments
# - You can override with VITE_BASE_PATH env var if needed
#
# LOCAL TESTING:
# - Run `npm run build` in the frontend directory
# - Serve the dist folder locally: `npx serve frontend/dist`
# =========================================================================

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# DISABLED: Remove this line to activate the workflow (see header comments)
if: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
      
      - name: Build for GitHub Pages
        run: npm run build
        env:
          # Enable GitHub Pages base path detection
          GITHUB_PAGES: 'true'
          # GITHUB_REPOSITORY is automatically set by GitHub Actions
          # Format: "owner/repo" - vite.config.ts extracts repo name for base path
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
