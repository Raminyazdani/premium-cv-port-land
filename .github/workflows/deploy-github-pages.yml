name: Deploy to GitHub Pages

# This workflow is OPTIONAL and provides GitHub Pages deployment as a fallback.
# For better experience, use Vercel, Netlify, or Cloudflare Pages instead.
# 
# To enable this workflow:
# 1. Go to repository Settings → Pages
# 2. Under "Source", select "GitHub Actions"
# 3. Uncomment the workflow below (remove the "if: false" condition)
# 4. Push to main branch or trigger manually

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Disable by default - uncomment to enable
# Remove the line below to activate this workflow
if: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
      
      - name: Build
        run: npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
