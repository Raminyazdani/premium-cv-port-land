name: PR Preview (GitHub Actions)

# =========================================================================
# INTENTIONALLY DISABLED WORKFLOW
# =========================================================================
# This workflow is OPTIONAL and provides PR previews using GitHub artifacts.
# For better experience, use Vercel, Netlify, or Cloudflare Pages instead.
#
# STATUS: Disabled by design - artifact-based previews require manual download.
#
# WHY DISABLED:
# - GitHub Actions artifacts require manual download to test
# - Vercel/Netlify provide instant live preview URLs automatically
# - This workflow is kept for reference and can be enabled as a fallback
#
# TO ENABLE THIS WORKFLOW:
# 1. Remove the global `if: false` condition below
# 2. Push to trigger on next PR
#
# HOW IT WORKS:
# - Builds PR changes and uploads as artifact
# - Users must download artifact manually to test:
#   1. Download the `pr-preview-{number}` artifact from the workflow run
#   2. Extract the ZIP file
#   3. Serve with: `npx serve dist`
#   4. Open http://localhost:3000
# =========================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

# DISABLED: Remove this line to activate the workflow (see header comments)
if: false

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: frontend

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
      
      - name: Build
        run: npm run build
      
      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: frontend/dist/
          retention-days: 7
      
      - name: Comment PR with artifact link
        uses: actions/github-script@v8
        with:
          script: |
            const pr_number = context.payload.pull_request.number;
            const run_id = context.runId;
            const repo = context.repo;
            
            const artifactUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${run_id}`;
            
            github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: pr_number,
              body: `🔍 **Preview Build Complete**\n\n` +
                    `Download the preview build artifact:\n` +
                    `${artifactUrl}\n\n` +
                    `### To test locally:\n` +
                    `1. Download the \`pr-preview-${pr_number}\` artifact from the link above\n` +
                    `2. Extract the ZIP file\n` +
                    `3. Serve with: \`npx serve dist\`\n` +
                    `4. Open http://localhost:3000\n\n` +
                    `---\n` +
                    `💡 **Tip**: For live preview URLs, use [Vercel](https://vercel.com), [Netlify](https://netlify.com), or [Cloudflare Pages](https://pages.cloudflare.com) instead.`
            });
